{% extends "admin/base_site.html" %}

{% block extrastyle %}
<style>
    .dashboard-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .stat-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        transition: transform 0.2s;
    }
    .stat-card:hover {
        transform: translateY(-2px);
    }
    .stat-card h3 {
        margin: 0 0 15px 0;
        color: #417690;
        font-size: 16px;
        border-left: 4px solid #79aec8;
        padding-left: 12px;
    }
    .stat-number {
        font-size: 42px;
        font-weight: bold;
        color: #2b5c6f;
        text-align: center;
        margin: 10px 0;
    }
    .stat-sub {
        display: flex;
        justify-content: space-around;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid #eee;
    }
    .sub-item {
        text-align: center;
    }
    .sub-value {
        font-size: 20px;
        font-weight: bold;
    }
    .sub-label {
        font-size: 12px;
        color: #999;
    }
    .status-pending { color: #ff9800; }
    .status-running { color: #2196f3; }
    .status-completed { color: #4caf50; }
    .status-failed { color: #f44336; }
    .trend-container {
        display: flex;
        align-items: flex-end;
        height: 150px;
        gap: 8px;
        margin-top: 10px;
    }
    .trend-bar {
        flex: 1;
        background: #79aec8;
        border-radius: 4px 4px 0 0;
        transition: height 0.3s;
    }
    .trend-bar:hover {
        background: #417690;
    }
    .trend-label {
        text-align: center;
        font-size: 11px;
        margin-top: 8px;
        color: #666;
    }
    .trend-value {
        text-align: center;
        font-size: 10px;
        color: #999;
    }
    .tasks-table {
        width: 100%;
        border-collapse: collapse;
    }
    .tasks-table th, .tasks-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }
    .tasks-table th {
        background: #f5f5f5;
        font-weight: bold;
        color: #417690;
    }
    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
    }
    .badge-pending { background: #fff3e0; color: #ff9800; }
    .badge-running { background: #e3f2fd; color: #2196f3; }
    .badge-completed { background: #e8f5e9; color: #4caf50; }
    .badge-failed { background: #ffebee; color: #f44336; }
    .refresh-btn {
        float: right;
        background: #417690;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 15px;
    }
    .refresh-btn:hover {
        background: #2b5c6f;
    }
    .run-crawl-form {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .run-crawl-form input {
        padding: 8px 12px;
        width: 400px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-right: 10px;
    }
    .run-crawl-form button {
        background: #417690;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 4px;
        cursor: pointer;
    }
    .run-crawl-form button:hover {
        background: #2b5c6f;
    }
</style>
{% endblock %}

{% block content %}
<h1>📊 数据统计看板</h1>

<div class="run-crawl-form">
    <h3>🚀 启动爬虫任务</h3>
    <form id="crawl-form">
        <input type="text" name="seed_url" placeholder="输入种子URL (例如: https://httpbin.org/html)" size="50" required>
        <input type="number" name="max_depth" placeholder="深度" value="1" style="width:80px">
        <button type="submit">启动爬虫</button>
    </form>
    <div id="crawl-result" style="margin-top: 10px;"></div>
</div>

<button class="refresh-btn" onclick="refreshAll()">🔄 刷新数据</button>

<div class="dashboard-stats">
    <div class="stat-card">
        <h3>📄 网页快照</h3>
        <div class="stat-number" id="total-pages">-</div>
        <div class="stat-sub" id="category-stats"></div>
    </div>
    
    <div class="stat-card">
        <h3>🌱 种子URL</h3>
        <div class="stat-number" id="total-seeds">-</div>
        <div class="stat-sub" id="seed-stats"></div>
    </div>
    
    <div class="stat-card">
        <h3>🤖 爬虫任务</h3>
        <div class="stat-number" id="total-tasks">-</div>
        <div class="stat-sub" id="task-stats"></div>
    </div>
    
    <div class="stat-card">
        <h3>⚙️ 爬虫配置</h3>
        <div class="stat-number" id="total-configs">-</div>
        <div class="stat-sub" id="config-stats"></div>
    </div>
</div>

<div class="stat-card" style="margin-bottom: 20px;">
    <h3>📈 近7天抓取趋势</h3>
    <div id="trend-chart"></div>
</div>

<div class="stat-card">
    <h3>📋 最近爬虫任务</h3>
    <div id="tasks-list"></div>
</div>

<script>
    function refreshStats() {
        fetch('/admin/api/stats/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('total-pages').innerText = data.total_pages;
                document.getElementById('total-seeds').innerText = data.seed_stats.total;
                document.getElementById('total-tasks').innerText = data.task_stats.total;
                document.getElementById('total-configs').innerText = data.config_stats.total;
                
                // 分类统计
                const categoryHtml = Object.entries(data.by_category).map(([k, v]) => `
                    <div class="sub-item">
                        <div class="sub-value">${v}</div>
                        <div class="sub-label">${k}</div>
                    </div>
                `).join('');
                document.getElementById('category-stats').innerHTML = categoryHtml;
                
                // 种子统计
                const seedHtml = `
                    <div class="sub-item"><div class="sub-value status-pending">${data.seed_stats.pending}</div><div class="sub-label">等待</div></div>
                    <div class="sub-item"><div class="sub-value status-running">${data.seed_stats.crawling}</div><div class="sub-label">爬取</div></div>
                    <div class="sub-item"><div class="sub-value status-completed">${data.seed_stats.success}</div><div class="sub-label">成功</div></div>
                    <div class="sub-item"><div class="sub-value status-failed">${data.seed_stats.failed}</div><div class="sub-label">失败</div></div>
                `;
                document.getElementById('seed-stats').innerHTML = seedHtml;
                
                // 任务统计
                const taskHtml = `
                    <div class="sub-item"><div class="sub-value status-pending">${data.task_stats.pending}</div><div class="sub-label">等待</div></div>
                    <div class="sub-item"><div class="sub-value status-running">${data.task_stats.running}</div><div class="sub-label">运行</div></div>
                    <div class="sub-item"><div class="sub-value status-completed">${data.task_stats.completed}</div><div class="sub-label">完成</div></div>
                    <div class="sub-item"><div class="sub-value status-failed">${data.task_stats.failed}</div><div class="sub-label">失败</div></div>
                `;
                document.getElementById('task-stats').innerHTML = taskHtml;
                
                // 配置统计
                const configHtml = `
                    <div class="sub-item"><div class="sub-value">${data.config_stats.total}</div><div class="sub-label">总数</div></div>
                    <div class="sub-item"><div class="sub-value status-completed">${data.config_stats.enabled}</div><div class="sub-label">启用</div></div>
                `;
                document.getElementById('config-stats').innerHTML = configHtml;
                
                // 趋势图
                const trend = data.trend;
                const maxCount = Math.max(...trend.map(d => d.count), 1);
                const chartHtml = `
                    <div class="trend-container">
                        ${trend.map(d => `
                            <div style="flex:1; text-align:center;">
                                <div class="trend-bar" style="height: ${d.count/maxCount*120}px;" title="${d.date}: ${d.count}条"></div>
                                <div class="trend-value">${d.count}</div>
                                <div class="trend-label">${d.date}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                document.getElementById('trend-chart').innerHTML = chartHtml;
            });
    }
    
    function refreshTasks() {
        fetch('/admin/api/tasks/')
            .then(res => res.json())
            .then(data => {
                if (data.tasks.length === 0) {
                    document.getElementById('tasks-list').innerHTML = '<p style="text-align:center; color:#999;">暂无任务记录</p>';
                    return;
                }
                
                const tableHtml = `
                    <table class="tasks-table">
                        <thead><tr><th>任务ID</th><th>种子URL</th><th>状态</th><th>页面数</th><th>成功</th><th>失败</th><th>创建时间</th></tr></thead>
                        <tbody>
                            ${data.tasks.map(t => `
                                <tr>
                                    <td><code>${t.id}</code></td>
                                    <td title="${t.seed_url}">${t.seed_url}</td>
                                    <td><span class="badge badge-${t.status}">${t.status}</span></td>
                                    <td>${t.total_pages}</td>
                                    <td class="status-completed">${t.success_pages}</td>
                                    <td class="status-failed">${t.failed_pages}</td>
                                    <td>${t.created_at}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('tasks-list').innerHTML = tableHtml;
            });
    }
    
    function refreshAll() {
        refreshStats();
        refreshTasks();
    }
    
    document.getElementById('crawl-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        fetch('/admin/api/run-crawl/', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                document.getElementById('crawl-result').innerHTML = `<span style="color:green;">✅ ${data.message}</span>`;
                e.target.reset();
                setTimeout(() => { refreshAll(); }, 3000);
            })
            .catch(err => {
                document.getElementById('crawl-result').innerHTML = `<span style="color:red;">❌ 启动失败: ${err}</span>`;
            });
    });
    
    refreshAll();
    setInterval(refreshAll, 10000);
</script>
{% endblock %}
